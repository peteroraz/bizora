name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod
        continue-on-error: false

  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
      - name: terraform validate
        run: |
          set -euo pipefail
          for env in staging prod; do
            terraform -chdir="infra/terraform/envs/${env}" init -backend=false -input=false
            terraform -chdir="infra/terraform/envs/${env}" validate
          done

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bizora
          POSTGRES_PASSWORD: bizora
          POSTGRES_DB: bizora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bizora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - run: pnpm install --frozen-lockfile
      # Offline voice (ADR-040): the speech model is served from this site, so it is fetched before the build and
      # checked against models.lock.json. A robot-voice recording of a sale feeds the fake microphone.
      - uses: actions/cache@v4
        with:
          path: apps/web/public/voice/models
          key: voice-models-${{ hashFiles('apps/web/src/lib/voice/models.json', 'apps/web/src/lib/voice/models.lock.json') }}
      # New models (ADR-041): their hashes are recorded on this first fetch and committed to the lock.
      - run: pnpm --filter @bizora/web voice:models -- --allow-unlocked
      - name: Make the voice test recording
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q espeak-ng
          mkdir -p apps/web/e2e/fixtures
          espeak-ng -v en-us -s 130 -w apps/web/e2e/fixtures/voice-sale.wav "Sold two bags of rice at seventy five thousand naira each, cash."
      - run: pnpm build
      - run: pnpm --filter @bizora/api db:migrate
        env:
          DATABASE_URL: postgres://bizora:bizora@localhost:5432/bizora
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm --filter @bizora/web e2e
        env:
          CI: "true"
          DATABASE_URL: postgres://bizora:bizora@localhost:5432/bizora
      # The Admin portal (ADR-037), with its own API server and a stand-in for Google.
      - run: pnpm --filter @bizora/admin e2e
        env:
          CI: "true"
          DATABASE_URL: postgres://bizora:bizora@localhost:5432/bizora

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --file apps/api/Dockerfile --tag bizora-api:ci .
      - name: Build web image
        run: docker build --file apps/web/Dockerfile --tag bizora-web:ci .
      - name: Build admin image
        run: docker build --file apps/admin/Dockerfile --tag bizora-admin:ci .
