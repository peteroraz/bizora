services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bizora
      POSTGRES_PASSWORD: bizora
      POSTGRES_DB: bizora
    ports:
      - "5432:5432"
    volumes:
      - bizora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  bizora_pg:
